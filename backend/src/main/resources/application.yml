spring:
  application:
    name: light-spec
  datasource:
    url: jdbc:sqlite:${LIGHTSPEC_DB_PATH:./data/lightspec.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA busy_timeout=5000
  flyway:
    enabled: true
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

lightspec:
  security:
    cookie-secure: ${LIGHTSPEC_COOKIE_SECURE:true}
    jwt:
      secret: ${LIGHTSPEC_JWT_SECRET:}
      ttl: ${LIGHTSPEC_JWT_TTL:PT15M}
